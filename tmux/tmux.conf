# enable plugin manager
set -g @plugin 'tmux-plugins/tpm'

# plugins
set -g @plugin 'tmux-plugins/tmux-sensible' # set sane defaults
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'

# set -g @plugin "alexghergh/nvim-tmux-navigation"
set -g @plugin 'christoomey/vim-tmux-navigator'

# plugin settings
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# tmux themes
set -g @plugin 'fabioluciano/tmux-tokyo-night'
# set -g @plugin "dreamsofcode-io/catppuccin-tmux"
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'dracula/tmux'

# extra statusline for gap
# set -g status 2
# set -g status-style bg=default

# tmux theme options
# custom
# set-option -g status-right "%I:%M %p"

# themepack
# set -g @themepack 'powerline/default/gray'

# dracula
# set -g @dracula-show-powerline true
# set -g @dracula-show-left-icon session
# set -g @dracula-left-icon-padding 1
# set -g @dracula-plugins "battery ram-usage weather"

# set -g @dracula-fixed-location "NYC"
# set -g @dracula-show-left-sep 
# set -g @dracula-show-right-sep 

# options
set -g mouse on
set -g bell-action none
set -g set-titles on
set -g set-titles-string "tmux (#I:#W)"
set -g base-index 1
setw -g mode-keys vi
set -g status-keys vi
set-window-option -g mode-keys vi

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# don't dettach after killing a session
set-option -g detach-on-destroy off

# colors
# tmux-256color (not screen-256color): screen-256color's terminfo has no `Ms`
# entry, which is the capability tmux needs to push the clipboard out over
# OSC 52. It also costs truecolor and italics.
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-kitty:RGB:clipboard:usstyle"
set -sa terminal-features ",wezterm*:RGB:clipboard:usstyle"
set -ga terminal-overrides ",*256col*:Tc"

# clipboard
# Two independent paths on purpose:
#   1. tmux-yank pipes the selection straight to wl-copy (local Wayland).
#   2. set-clipboard + the `clipboard` terminal-feature emit OSC 52 outward,
#      which also survives SSH.
set -g set-clipboard on
set -g allow-passthrough on

# copy-pipe runs from the session environment, not the pane's -- without this
# wl-copy loses WAYLAND_DISPLAY on a re-attach.
set -ga update-environment " WAYLAND_DISPLAY XDG_SESSION_TYPE"

# tmux-yank: CLIPBOARD (not PRIMARY) for both keyboard and mouse selections
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action 'copy-pipe-and-cancel'

# Window options
setw -g monitor-activity on
setw -g automatic-rename on

# increase scrollback buffer
set -g history-limit 50000

# scrollbar (tmux 3.6+) -- position indicator for long scrollback
set -g pane-scrollbars on
set -g pane-scrollbars-position right
set -g pane-scrollbars-style "bg=colour236,fg=colour110,width=1,pad=0"

# keybinds

# change prefix key
# unbind C-b
# set -g prefix2 C-space
# set-option -g prefix C-space
# bind-key C-space send-prefix

# kill session / server
bind q confirm kill-session
bind Q confirm kill-server
# rebind move to last window
bind a last-window

# source file
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# open new pane in CWD
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# nvim-tmux-navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

# # resize panes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -r m resize-pane -Z

# reorder current window left / right (keep focus on it)
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# shift + alt + h/l to cycle through windows
bind -n M-H previous-window
bind -n M-L next-window

# copy like vim
# NOTE: `y` and MouseDragEnd1Pane are deliberately NOT bound here -- tmux-yank
# binds them to a wl-copy pipe, and TPM is sourced at the bottom of this file so
# its bindings land last.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# paste from the system clipboard
bind P run "wl-paste --no-newline | tmux load-buffer - && tmux paste-buffer"

# wheel scrolling in copy mode
# 3 lines per notch: matches most GUI terminals. tmux's default of 5 tends to
# overshoot short messages in dense Claude Code output.
bind-key -T copy-mode-vi WheelUpPane   send-keys -X -N 3 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 3 scroll-down
# (C-u/C-d half-page and g/G top/bottom are already copy-mode-vi defaults)

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# run the package manager
# MUST stay last: tmux runs config commands as an ordered queue, so plugin
# bindings sourced here would otherwise be overwritten by the binds above.
run '~/.tmux/plugins/tpm/tpm'
